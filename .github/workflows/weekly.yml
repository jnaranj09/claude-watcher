# Weekly (docs/threat-model.md T-C2, T-C9): a new CVE in a locked dependency is found within a
# week without a push, and the fuzz targets run long. GitHub turns a schedule off after 60 days
# with no activity in a public repo, without a notice: the threat model's manual row covers it.
name: Weekly

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run security

  fuzz:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      # A failure prints fast-check's seed and the shrunk input: add it as a plain test with the fix.
      # 20000 runs take about 8 s a property on the runner, past Vitest's 5 s default.
      - run: npx vitest run --project main-unit --testTimeout=600000 src/main/hooks/boundaries.fuzz.test.ts
        env:
          FUZZ_RUNS: '20000'

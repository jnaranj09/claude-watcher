# The gate (CLAUDE.md "Gates"): typecheck, lint, test, build, and the security scans
# (`npm run security`, docs/threat-model.md). Runs on every push and PR to main, and is CALLED by
# release.yml so a release never skips it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # gitleaks reads the whole history; a shallow clone is red ("0 commits").
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # Node built-ins and docker only: no `npm ci`.
      - run: npm run security

  # DAST (docs/threat-model.md T-C10): ZAP's API scan against a throwaway e2e-profile app, plus
  # the docs page under its CSP (tests/e2e/dast.e2e.ts). No `claude` here; the spec needs none.
  dast:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - run: npm ci
      # Electron 44's install does not fetch its binary; the sandbox helper must be setuid root.
      - name: Electron binary
        run: |
          npx install-electron --no
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run build
      - run: xvfb-run -a npx playwright test tests/e2e/dast.e2e.ts

# The gate (CLAUDE.md "Gates"): typecheck, lint, test (with coverage), the CRAP budget, build, and
# the security scans (`npm run security`, docs/threat-model.md). Runs on every push and PR to main,
# and is CALLED by release.yml so a release never skips it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # `npm test` plus the per-function coverage report the CRAP check reads (coverage/lcov.info).
      - run: npm run test:coverage
      # CRAP budget (tests/main/crapBudget.guard.test.ts): `npm run crap`, plus `--base-allow`, the
      # allow list as it is on main, so a new entry or a higher pin fails. While main has none (the
      # change that brings the list), the branch's own list is the base: its pins are the start.
      - name: CRAP budget
        run: |
          git fetch --no-tags --depth=1 origin main
          git show origin/main:crap-allow.json > "$RUNNER_TEMP/base-allow.json" || cp crap-allow.json "$RUNNER_TEMP/base-allow.json"
          node tools/crap/cc_ts.mjs --root . src > coverage/functions.json
          node tools/crap/crap.mjs --functions coverage/functions.json --coverage coverage/lcov.info --exclude src/mod/ --exclude src/__fixtures__/ --exclude src/renderer/src/test/ --cc-cap 0 --limit 30 --allow crap-allow.json --base-allow "$RUNNER_TEMP/base-allow.json"
      - run: npm run build

  security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks reads the whole history; a shallow clone is red ("0 commits").
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Node built-ins and docker only: no `npm ci`.
      - run: npm run security

  # DAST (docs/threat-model.md T-C10): ZAP's API scan against a throwaway e2e-profile app, plus
  # the docs page under its CSP (tests/e2e/dast.e2e.ts). No `claude` here; the spec needs none.
  # Then the UI probe (tests/e2e/uiProbe.e2e.ts) at 900 and 1400 px; it launches a stand-in
  # claude (tests/e2e/probeFixtures.ts), not a real one. The screen is wider than 1400 px.
  dast:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - run: npm ci
      # Electron 44's install does not fetch its binary; the sandbox helper must be setuid root.
      - name: Electron binary
        run: |
          npx install-electron --no
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run build
      - run: xvfb-run -a npx playwright test tests/e2e/dast.e2e.ts
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" npx playwright test --project=w900 --project=w1400

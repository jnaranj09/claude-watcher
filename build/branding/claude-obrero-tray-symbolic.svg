      <line x1="11" y1="15.6" x2="16.4" y2="15.6"/>
      <line x1="11" y1="15.6" x2="14.9" y2="19.3"/>
      <line x1="11" y1="15.6" x2="11"   y2="20.2"/>
      <line x1="11" y1="15.6" x2="7.1"  y2="19.3"/>
      <line x1="11" y1="15.6" x2="5.6"  y2="15.6"/>
      <line x1="11" y1="15.6" x2="7.4"  y2="12.6"/>
      <line x1="11" y1="15.6" x2="14.6" y2="12.6"/>
    </g>
  </g>
</svg>

appId: com.claudewatcher.app
productName: Claude Watcher
executableName: claude-watcher
directories:
  buildResources: build
# ALLOWLIST — only what the app needs at RUNTIME goes into app.asar.
#
# This REPLACES the electron-vite scaffold's denylist, which shipped the WHOLE repo inside
# the package: `!src/*` excludes only src's DIRECT children (not `src/main/**`), and nothing
# excluded `docs/`, `.claude/` (rules + the full BMAD skill set), `tests/`, `_bmad/`,
# `_bmad-output/`, `test-results/` or `eslint-rules/`. The result was 491 non-node_modules
# entries of internal notes riding in a shipped artifact.
#
# An allowlist is the right shape here: a NEW repo directory is excluded by DEFAULT and
# cannot silently start shipping. Anything the app loads at runtime must be listed below.
files:
  # The electron-vite build output — main, preload, renderer. `main` in package.json points
  # at ./out/main/index.js, so this is the app.
  - out/**
  # Runtime assets read from disk at startup (the tray icons + app icon).
  - resources/**
  # Electron reads `main`, `name`, `version` out of this at boot.
  - package.json
  # Production dependencies. electron-builder resolves WHICH modules from the dependency
  # tree; the negations below only trim dead weight INSIDE the ones it picked.
  - node_modules/**
  # Each dependency's OWN tests/examples/docs + TypeScript sources and sourcemaps. None are
  # loaded at runtime (node-pty and zod alone shipped dozens of *.test.ts files).
  - '!node_modules/**/{test,tests,__tests__,example,examples,doc,docs}/**'
  - '!node_modules/**/*.{test,spec}.{js,ts,mjs,cjs}'
  - '!node_modules/**/*.{ts,map}'
asarUnpack:
  - resources/**
  # AC-5 / Guardrail #4: native binaries (node-pty's pty.node) must be reachable
  # outside the asar archive once packaged.
  - '**/*.node'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # Arch/CachyOS host — emit a `pacman -U`-installable package (.pkg.tar.zst).
  # (Was rpm-only for Fedora; rpm needs `rpmbuild` on the build host, Arch does not ship it.)
  target:
    - pacman
  maintainer: electronjs.org
  category: Utility
  # Story 2.3 AC-6 — canonical `.desktop` identity (tray/notification window association, AR-10).
  # electron-builder 26 GENERATES the .desktop from config (it does NOT read a raw build/*.desktop).
  # `syncDesktopName: true` names the installed file from package.json `desktopName`
  # (`com.claudewatcher.app.desktop`) and sets `StartupWMClass` to the canonical appId `com.claudewatcher.app`
  # (which MUST match Electron's app_id for the DE to associate the running window — and matches
  # `appId` above + main's `setAppUserModelId('com.claudewatcher.app')`). `Name` = `productName`
  # (`Claude Watcher`). NO MimeType / global-hotkey binding (cut). A committed reference copy of the
  # generated entry lives at build/com.claudewatcher.app.desktop for in-tree documentation.
  syncDesktopName: true
  desktop:
    entry:
      Categories: Utility;
# Target-specific options live at the TOP level (`PacmanOptions`), not under `linux:` —
# putting `depends` under `linux:` fails electron-builder's schema validation.
pacman:
  # Override electron-builder's built-in pacman depends (FpmTarget `getDefaultDepends`):
  # its list carries `libappindicator-gtk3`, which is NOT in the Arch official repos, so
  # `pacman -U` would refuse the package on an unmet dep. The rest of that list (ffmpeg,
  # re2, minizip, http-parser, ...) is inherited Chromium-era cruft — Electron 39 bundles
  # those. Below is the real runtime set for an Electron 39 app on Arch.
  depends:
    - gtk3
    - nss
    - libxss
    - libnotify
    - at-spi2-core
    - libxtst
    - xdg-utils
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates

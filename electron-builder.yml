appId: com.claudewatcher.app
productName: Claude Watcher
executableName: claude-watcher
directories:
  buildResources: build
# ALLOWLIST — only what the app needs at RUNTIME goes into app.asar.
#
# This REPLACES the electron-vite scaffold's denylist, which shipped the WHOLE repo inside
# the package: `!src/*` excludes only src's DIRECT children (not `src/main/**`), and nothing
# excluded `docs/`, `.claude/` (rules + the full BMAD skill set), `tests/`, `_bmad/`,
# `_bmad-output/`, `test-results/` or `eslint-rules/`. The result was 491 non-node_modules
# entries of internal notes riding in a shipped artifact.
#
# An allowlist is the right shape here: a NEW repo directory is excluded by DEFAULT and
# cannot silently start shipping. Anything the app loads at runtime must be listed below.
files:
  # The electron-vite build output — main, preload, renderer. `main` in package.json points
  # at ./out/main/index.js, so this is the app.
  - out/**
  # Runtime assets read from disk at startup (the tray icons + app icon).
  - resources/**
  # Electron reads `main`, `name`, `version` out of this at boot.
  - package.json
  # Production dependencies. electron-builder resolves WHICH modules from the dependency
  # tree; the negations below only trim dead weight INSIDE the ones it picked.
  - node_modules/**
  # Each dependency's OWN tests/examples/docs + TypeScript sources and sourcemaps. None are
  # loaded at runtime (node-pty and zod alone shipped dozens of *.test.ts files).
  - '!node_modules/**/{test,tests,__tests__,example,examples,doc,docs}/**'
  - '!node_modules/**/*.{test,spec}.{js,ts,mjs,cjs}'
  - '!node_modules/**/*.{ts,map}'
asarUnpack:
  - resources/**
  # AC-5 / Guardrail #4: native binaries (node-pty's pty.node) must be reachable
  # outside the asar archive once packaged.
  - '**/*.node'
# Bundled themes (spec 2026-09-25): shipped READ-ONLY beside app.asar, in <resourcesPath>/themes,
# as plain files — the theme reader's lstat symlink guard works there exactly as it does on
# <userData>/themes. The ids must match BUNDLED_THEME_IDS (src/main/themes/bundledThemes.ts;
# bundledThemes.test.ts fails when they differ). `src/` holds the wallpaper generator scripts,
# which the app never reads.
extraResources:
  - from: docs/themes/examples
    to: themes
    filter:
      - liquid-glass/**
      - paper/**
      - '!*/src/**'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # Public release (spec 2026-09-30): built on GitHub Actions `ubuntu-22.04`, see
  # .claude/rules/release.md. Building rpm locally needs `rpmbuild`, deb needs `dpkg-deb`.
  target:
    - deb
    - rpm
    - pacman
  maintainer: Jose Naranjo <jmnaranjo09@gmail.com>
  artifactName: ${name}-${version}-${arch}.${ext}
  category: Utility
  # Story 2.3 AC-6 — canonical `.desktop` identity (tray/notification window association, AR-10).
  # electron-builder 26 GENERATES the .desktop from config (it does NOT read a raw build/*.desktop).
  # `syncDesktopName: true` names the installed file from package.json `desktopName`
  # (`com.claudewatcher.app.desktop`) and sets `StartupWMClass` to the canonical appId `com.claudewatcher.app`
  # (which MUST match Electron's app_id for the DE to associate the running window — and matches
  # `appId` above + main's `setAppUserModelId('com.claudewatcher.app')`). `Name` = `productName`
  # (`Claude Watcher`). NO MimeType / global-hotkey binding (cut). A committed reference copy of the
  # generated entry lives at build/com.claudewatcher.app.desktop for in-tree documentation.
  syncDesktopName: true
  desktop:
    entry:
      Categories: Utility;
# Target-specific options live at the TOP level (`PacmanOptions`), not under `linux:` —
# putting `depends` under `linux:` fails electron-builder's schema validation.
pacman:
  # Override electron-builder's built-in pacman depends (FpmTarget `getDefaultDepends`):
  # its list carries `libappindicator-gtk3`, which is NOT in the Arch official repos, so
  # `pacman -U` would refuse the package on an unmet dep. The rest of that list (ffmpeg,
  # re2, minizip, http-parser, ...) is inherited Chromium-era cruft — Electron 39 bundles
  # those. Below is the real runtime set for an Electron 39 app on Arch.
  depends:
    - gtk3
    - nss
    - libxss
    - libnotify
    - at-spi2-core
    - libxtst
    - xdg-utils
    # libasound.so.2 — Electron links it; missing on a clean Arch (install check, 2026-09-30).
    - alsa-lib
# Same reason as `pacman.depends`: the electron-builder defaults can pull libappindicator.
# These lists are proven by the release workflow's install check (clean debian/ubuntu/fedora
# containers + ldd); fix them there, not by guessing.
deb:
  depends:
    - libgtk-3-0
    - libnss3
    - libxss1
    - libnotify4
    - libatspi2.0-0
    - libxtst6
    - xdg-utils
    - libasound2 | libasound2t64
    # Ubuntu 22.04's base has no libgbm (install check, 2026-09-30); Debian 12 pulled it in.
    - libgbm1
rpm:
  depends:
    - gtk3
    - nss
    - libXScrnSaver
    - libnotify
    - at-spi2-core
    - libXtst
    - xdg-utils
    - alsa-lib
npmRebuild: false
# Electron fuses (technical-taste §5b-22), flipped in the binary at package time. Each one closes a
# way to run arbitrary code AS this app: ELECTRON_RUN_AS_NODE, NODE_OPTIONS / NODE_EXTRA_CA_CERTS,
# and --inspect / SIGUSR1. Nothing in the app uses them (checked 2026-10-01: no process.fork, no
# RUN_AS_NODE). `onlyLoadAppFromAsar` stops a loose `app/` folder beside app.asar from loading.
# Pinned by tests/unit/electronFuses.test.ts; `npx @electron/fuses read --app <binary>` shows them.
# Left at Electron's default, on purpose:
# - enableCookieEncryption: on Linux it goes through the OS keyring (kwallet / libsecret) and can
#   prompt at start; the app keeps no cookies.
# - grantFileProtocolExtraPrivileges: the packaged renderer loads from file://; turning it off
#   needs its own test pass.
# - enableEmbeddedAsarIntegrityValidation: macOS and Windows only.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
# No auto-update (spec 2026-09-30 D-4). `null`, not an omitted key: with no `publish`,
# electron-builder infers a GitHub provider from package.json `repository` and ships an
# app-update.yml nothing reads. Users download releases from GitHub by hand.
publish: null

appId: com.claudewatcher.app
productName: Claude Watcher
executableName: claude-watcher
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  # AC-5 / Guardrail #4: native binaries (node-pty's pty.node) must be reachable
  # outside the asar archive once packaged.
  - '**/*.node'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - rpm
  maintainer: electronjs.org
  category: Utility
  # Story 2.3 AC-6 — canonical `.desktop` identity (tray/notification window association, AR-10).
  # electron-builder 26 GENERATES the .desktop from config (it does NOT read a raw build/*.desktop).
  # `syncDesktopName: true` names the installed file from package.json `desktopName`
  # (`com.claudewatcher.app.desktop`) and sets `StartupWMClass` to the canonical appId `com.claudewatcher.app`
  # (which MUST match Electron's app_id for the DE to associate the running window — and matches
  # `appId` above + main's `setAppUserModelId('com.claudewatcher.app')`). `Name` = `productName`
  # (`Claude Watcher`). NO MimeType / global-hotkey binding (cut). A committed reference copy of the
  # generated entry lives at build/com.claudewatcher.app.desktop for in-tree documentation.
  syncDesktopName: true
  desktop:
    entry:
      Categories: Utility;
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
